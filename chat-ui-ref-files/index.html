<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Chat Widget</title>
    <style>
      html {
        height: 100%;
      }

      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(900px circle at 10% -10%, rgba(15, 118, 110, 0.12), transparent 42%),
          radial-gradient(700px circle at 100% 110%, rgba(180, 83, 9, 0.10), transparent 40%),
          #f7f7f8;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        display: grid;
        place-items: stretch;
      }

      restaurant-chat-widget {
        display: block;
        width: 100%;
        height: 100%;
      }

      @media (min-width: 900px) {
        body {
          place-items: center;
          padding: 28px;
        }

        restaurant-chat-widget {
          width: min(100%, 980px);
          height: min(92vh, 860px);
        }
      }
    </style>
  </head>


  <body>
    
    <restaurant-chat-widget
      api-base-url="https://mbd-api-priority-score.onrender.com"
      restaurant-id="11111111-1111-4111-8111-555555555555"
      layout="fullscreen"
      title="Ask Us Questions"
      subtitle="Menu questions, recommendations, operations. Here to help."
      placeholder="Try: What are your vegan options?"
      accent-color="#0f766e"
      send-label="Ask"
    ></restaurant-chat-widget>
    <script type="module" src="./chat-widget.js"></script>

  </body>

  
</html>
