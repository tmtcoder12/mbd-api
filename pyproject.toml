[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "mintgen-api"
version = "1.0.0"
description = "Tenant-isolated multilingual RAG API and transactional knowledge-ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = ["fastapi", "multilingual", "pgvector", "rag", "supabase"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "openai>=2.20,<4",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "redis>=5.2,<9",
  "requests>=2.32,<3",
  "stripe>=11,<16",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<3",
  "pip-audit>=2.8,<3",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-requests>=2.32,<3",
]

[project.scripts]
mintgen-api = "mbd_api.__main__:main"
mintgen-ingest = "mbd_api.ingest:main"
mbd-api = "mbd_api.__main__:main"
mbd-ingest = "mbd_api.ingest:main"

[project.urls]
Repository = "https://github.com/tmtcoder12/mbd-api"
Issues = "https://github.com/tmtcoder12/mbd-api/issues"

[tool.setuptools.packages.find]
include = ["mbd_api*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["mbd_api/core.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["mbd_api"]
exclude = ["mbd_api/core.py"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "mbd_api.core"
ignore_errors = true
